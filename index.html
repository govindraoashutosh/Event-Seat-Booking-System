<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Seat Booking System</title>
</head>
<body>
    <h1>Event Seat Booking </h1>
    <p>Book your seat for the upcoming event</p>

    <main>
        <section class="event-details">
            <h2>Event Details</h2>
            <div class="event-info">
                 <div>
                <h2>Event</h2>
                <p>Musical Night</p>
            </div>
            <div>
                <h2>Date</h2>
                <p>14 september 2026</p>
            </div>
            <div>
                <h2>Venue</h2>
                <p>City Auditorium</p>
            </div>
            <div>
                <h2>capacity</h2>
                <p>60 seats</p>
            </div>
            </div>
           
        </section>

        <section class="booking-section">
            <h2>Select Your Seats</h2>
            <div class="booking-info">
                <div>
                    <span class="Available"></span>
                    <p>Available</p>
                </div>
                <div>
                    <span class="Selected"></span>
                    <p>Selected</p>
                </div>
                <div>
                    <span class="Booked"></span>
                    <p>Booked</p>
                </div>
            </div>

            <div class="Stage">
                <p>Stage</p>
            </div>

            <div id="seat-container" class="seat-container"></div>
        </section>

        
    </main>
    
    

    
</body>
</html>
